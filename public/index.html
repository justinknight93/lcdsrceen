  <script type="module">
    import { bmpToBinaryArray, loadImage } from './js/bitmap.js';
    import { drawImage, clear, drawString } from './js/lcd.js';

    let example = 1;
    let interval;

    const startExample1 = async () => {
      clearInterval(interval)
      const image = await loadImage('images/smile.bmp');
      const binaryArray = bmpToBinaryArray(image);
      interval = setInterval(() => {
        clear();
        const now = new Date().getTime();
        drawImage(binaryArray, Math.sin(now / 200) * 8 + 8, 0)
      }, 33)
    }

    const startExample2 = () => {
      clearInterval(interval)
      let startPos = 32
      interval = setInterval(() => {
        clear();
        const now = new Date();
        let hours = now.getHours().toString().padStart(2, '0');;
        let minutes = now.getMinutes().toString().padStart(2, '0');;
        let seconds = now.getSeconds().toString().padStart(2, '0');;
        const time = `${hours}:${minutes}:${seconds}`;
        drawString(time, startPos, 4)


        startPos--
        if (startPos < -58) {
          startPos = 32
        }
      }, 50)
    }

    startExample1();

    document.querySelector('#screen').addEventListener('click', () => {
      if (example === 1) {
        example = 2;
        startExample2();
      } else {
        example = 1
        startExample1();
      }
    })
  </script>
